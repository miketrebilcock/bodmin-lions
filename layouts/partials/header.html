<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Bodmin Lions Club home">
      {{- with resources.Get "images/lions-emblem.png" }}{{ $l := .Resize "112x webp" }}
      <img class="brand-mark" src="{{ $l.RelPermalink }}" width="56" height="56" alt="">{{ end }}
      <span class="brand-text"><strong>Bodmin Lions</strong><span>We serve · Dynergh</span></span>
    </a>
    <nav aria-label="Main">
      <details class="nav-toggle">
        <summary>Menu</summary>
        {{ template "menu" . }}
      </details>
      <div class="nav-wide">{{ template "menu" . }}</div>
    </nav>
  </div>
</header>
{{ define "menu" }}
<ul class="menu">
  {{- $current := . }}
  {{- range site.Menus.main }}
  <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.RelPermalink .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
  {{- end }}
</ul>
{{ end }}
