# Builds the Hugo site and publishes it to Cloudflare (a Worker serving ./public, see wrangler.jsonc).
#  - Pull request → a preview version at https://pr-<number>-bodmin-lions.bodmin-lions.workers.dev,
#    linked in a comment on the PR. The live site is not touched.
#  - Push to main (i.e. a merged PR), nightly (so past dates drop off "What's on"), or run by hand
#    → deploys the live site, bodminlions.org.uk.
name: Deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
env:
  HUGO_VERSION: 0.168.0
  WRANGLER_VERSION: 4.161.0
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-bodmin-lions.bodmin-lions.workers.dev/
      # Secrets aren't available to PRs from forks; skip the upload rather than fail.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Tells search engines not to index the preview and shows a "preview" note on the grant form.
      HUGO_PARAMS_PREVIEW: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
      - name: Build
        run: hugo --gc --minify --baseURL "$PREVIEW_URL"
      - name: Upload preview version (does not change the live site)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }}"
      - name: Comment the preview link on the PR
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Preview:** $PREVIEW_URL

          Built from ${SHA:0:7}. Check the pages you changed on a phone and a computer. Merge the PR to put it on bodminlions.org.uk."
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
      - name: Build
        run: hugo --gc --minify
      - name: Deploy the live site
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
