# Rebuilds the site every night so past dates drop off the "What's on" and home pages.
# Create a Deploy Hook in Cloudflare Pages (Settings → Builds & deployments) and save
# its URL as the repository secret CF_PAGES_DEPLOY_HOOK. Without the secret this does nothing.
name: Nightly rebuild
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No deploy hook configured; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
